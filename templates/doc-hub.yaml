# DocHub manifest: separate on this machine, does not reach git.
# The first section in hubs is the default hub; choose another with --hub <id> or DOC_HUB_ID.
hubs:
  main:                       # hub.id from the hub configuration
    path: ~/projects/hub      # hub clone on this machine
    projects: [<project-id>]  # hub projects that this repository is
    agent: <agent-name>       # default name; for another agent use DOC_HUB_AGENT_SUFFIX
    access: []                # other hub projects that agents work with
