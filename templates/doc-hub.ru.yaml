# Манифест DocHub: свой на этой машине, в git не попадает.
# Первый раздел в hubs — хаб по умолчанию, другой выбирается через --hub <id> или DOC_HUB_ID.
hubs:
  main:                       # hub.id из конфигурации хаба
    path: ~/projects/hub      # клон хаба на этой машине
    projects: [<project-id>]  # проекты хаба, которые и есть этот репозиторий
    agent: <agent-name>       # имя по умолчанию; другому агенту — DOC_HUB_AGENT_SUFFIX
    access: []                # другие проекты хаба, с которыми работают агенты
